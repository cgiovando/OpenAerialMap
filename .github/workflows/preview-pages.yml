# Preview deploy for a fork, so a branch can be shown to reviewers and
# non-technical readers before it is merged. Not part of the upstream deploy:
# production publishes to S3 and CloudFront from `main`.
#
# The catalog, raster tiles and uploader are production's. The PMTiles are not:
# production builds them with FOOTPRINT_COLLECTIONS unset, so they carry the OAM
# collection alone and the Source filter would have nothing to filter. Widening
# that is a deployment change we cannot make from here, so the preview serves its
# own pair, built by the same generator with the allowlist set and published as a
# release asset on this fork. Snapshot, not a live feed - regenerate and re-upload
# to refresh it.

name: 🔍 Preview on Pages

on:
  push:
    branches: [preview/oam-website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # Project Pages serve from /<repo>/, so the app needs the base both
          # for asset URLs and for its own path matching.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: https://api.imagery.hotosm.org
          VITE_STAC_URL: https://api.imagery.hotosm.org/stac
          VITE_STAC_TITILER_URL: https://api.imagery.hotosm.org/raster
          VITE_STAC_BROWSER_URL: https://api.imagery.hotosm.org/browser
          VITE_UPLOADER_URL: https://upload.imagery.hotosm.org
          VITE_PACKAGER_URL: https://packager.imagery.hotosm.org
          # Upstream has no such template until the page is merged, so the
          # preview points the intake button at this fork's copy.
          VITE_INTAKE_URL: https://github.com/${{ github.repository }}/issues/new?template=imagery-provider-intake.yml
          # Served from this Pages site, next to the app. PMTiles reads them
          # with range requests, which Pages supports.
          VITE_PMTILES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tiles/global-data.pmtiles
          VITE_DENSITY_PMTILES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tiles/global-coverage.pmtiles
        run: pnpm build

      - name: Fetch preview PMTiles
        # Multi-collection archives built by
        # backend/global-mosaic/scripts/gen_coverage_vector.py with
        # FOOTPRINT_COLLECTIONS=openaerialmap,vantor-opendata.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/tiles
          gh release download preview-tiles \
            --repo ${{ github.repository }} \
            --pattern '*.pmtiles' \
            --dir dist/tiles \
            --clobber

      - name: Add per-route entry points
        # Pages serves static files, so a deep link needs a file at that path.
        # 404.html covers anything else and lets the SPA route it.
        run: |
          for route in contribute browse; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
